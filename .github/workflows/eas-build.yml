name: EAS Build (Android)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'

jobs:
  eas-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: mobile
        run: |
          npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Login to Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN not set. Skipping build."; exit 1;
          fi
          eas login --token "$EXPO_TOKEN"

      - name: Run EAS build (Android)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas build --platform android --profile production --non-interactive

      - name: (Optional) Submit to Play Store
        if: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" | base64 -d > ./google-play-service-account.json
          npx eas submit --platform android --latest --non-interactive --service-account ./google-play-service-account.json
